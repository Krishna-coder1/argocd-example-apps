apiVersion: v1 
kind: Service 
metadata:
  namespace: bluegreen
  name: bluegreen-active
spec:
  type: NodePort 
  ports:
    - port: 3000
      targetPort: 8080
      name: http
  selector:
    app: bg-hello-api

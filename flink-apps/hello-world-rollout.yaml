
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-api
  namespace: flink
spec:
  replicas: 6

  selector:
    matchLabels:
      app: hello-api

  template:
    metadata:
      labels:
        app: hello-api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Hello from v13"
            - "-listen=:8080"
          ports:
            - containerPort: 8080

  strategy:
    canary:
      steps:
        - setWeight: 30
        - pause:
            duration: 10m
---
apiVersion: v1 
kind: Service 
metadata:
  name: simple-color-app
spec:
  type: NodePort 
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: hello-api

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-api
  namespace: flink
spec:
  replicas: 4

  selector:
    matchLabels:
      app: hello-api

  template:
    metadata:
      labels:
        app: hello-api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Hello from v2"
            - "-listen=:8080"
          ports:
            - containerPort: 8080

  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause:
            duration: 60s
        - setWeight: 50
        - pause:
            duration: 60s
---
apiVersion: v1
kind: Service
metadata:
  name: hello-api
  namespace: flink
spec:
  selector:
    app: hello-api
  ports:
    - port: 80
      targetPort: 8080
